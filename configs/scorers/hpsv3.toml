[semantics]
backend = "hpsv3"
[semantics.source]
repository = "https://github.com/MizzenAI/HPSv3"
[semantics.weights]
repository = "MizzenAI/HPSv3"
files = ["HPSv3.safetensors"]
[[semantics.outputs]]
name = "mu"
direction = "higher"
[[semantics.outputs]]
name = "log_sigma"
direction = "lower"
[options.backbone]
repository = "Qwen/Qwen2-VL-7B-Instruct"
files = ["*.json", "*.safetensors", "*.txt", "*.jinja", "*.model"]
[limits]
max_batch_size = 2
queue_capacity = 24
request_timeout = 600.0
max_body_bytes = 33554432
cpu_threads = 4
