[[scorers]]
id = "hpsv3"
fingerprint = "9d0d57cfe59b6830f2b0dbd002316e8bcf1e0ef068746c1792fab03bc3705c3b"
input_schema = "image-text-v1"
structured_fields = []
attempts = 2
timeout = 600.0
concurrency = 2
batch_size = 2
transport = "shared_file"
seed_policy = "none"
seed = 0
[[scorers.outputs]]
name = "mu"
direction = "higher"
bounds = []
meaning = "Predicted preference mean"
[[scorers.outputs]]
name = "log_sigma"
direction = "lower"
bounds = []
meaning = "Diagnostic log standard deviation; not a reward"

